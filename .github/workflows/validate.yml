name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate source data
        run: python scripts/library.py check
      - name: Verify generated views
        run: python scripts/library.py check-generated
      - name: Run tests
        run: python -m unittest discover -s tests -v
